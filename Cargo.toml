[workspace]
resolver = "2"
members = [
    "crates/stowq-keys",
    "crates/stowq-math",
    "crates/stowq-format",
    "crates/stowq-store",
    "crates/stowq-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["David Torcivia <david.torcivia@gmail.com>"]
repository = "https://github.com/davidtorcivia/StowQ"

[workspace.dependencies]
bytes = "1"
sha2 = "0.10"
thiserror = "1"
stowq-format = { path = "crates/stowq-format" }
stowq-keys = { path = "crates/stowq-keys" }
stowq-math = { path = "crates/stowq-math" }
stowq-store = { path = "crates/stowq-store" }
