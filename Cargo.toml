[workspace]
resolver = "2"
members = [
    "crates/stowq-keys",
    "crates/stowq-math",
    "crates/stowq-format",
    "crates/stowq-store",
    "crates/stowq-core",
    "crates/stowq-testkit",
    "crates/stowq-cli",
    "crates/stowq-store-s3",
    "crates/stowq-worker",
    "crates/stowq-demo",
    "crates/stowq-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["David Torcivia <david.torcivia@gmail.com>"]
repository = "https://github.com/davidtorcivia/StowQ"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
getrandom = "0.3"
tokio = "1"
sha2 = "0.10"
thiserror = "1"
stowq-format = { path = "crates/stowq-format" }
stowq-keys = { path = "crates/stowq-keys" }
stowq-math = { path = "crates/stowq-math" }
stowq-store = { path = "crates/stowq-store" }
stowq-core = { path = "crates/stowq-core" }
stowq-store-s3 = { path = "crates/stowq-store-s3" }
stowq-worker = { path = "crates/stowq-worker" }
stowq-demo = { path = "crates/stowq-demo" }
stowq-testkit = { path = "crates/stowq-testkit" }
