[package]
name = "stowq-core"
description = "Queue state machine over an ObjectStore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
stowq-format.workspace = true
stowq-keys.workspace = true
stowq-math.workspace = true
stowq-store.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# Merged with the entry above: the js feature is wasm-only, never
# activated on native targets.
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
