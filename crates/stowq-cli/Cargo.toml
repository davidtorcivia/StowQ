[package]
name = "stowq-cli"
description = "Command-line interface for StowQ queues"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "stowq"
path = "src/main.rs"

[dependencies]
stowq-core.workspace = true
stowq-format.workspace = true
stowq-keys.workspace = true
stowq-math.workspace = true
stowq-store.workspace = true
clap = { version = "4", features = ["derive"] }
bytes.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
