name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # dtolnay/rust-toolchain pinned by SHA; resolves to 1.97.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (debug)
        run: cargo build --all
      - name: Test
        run: cargo test --all

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download tla2tools
        run: |
          url=https://github.com/tlaplus/tlaplus/releases/download/v1.7.4
          curl -fsSL "$url/tla2tools.jar" -o /tmp/tla2tools.jar
          sum=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          echo "$sum  /tmp/tla2tools.jar" | sha256sum --check --strict
      - name: Check claims model
        run: >
          java -cp /tmp/tla2tools.jar tlc2.TLC
          model/claims/StowQClaims.tla
      - name: Check terminal model
        run: >
          java -cp /tmp/tla2tools.jar tlc2.TLC
          model/terminal/StowQTerminal.tla
