name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # dtolnay/rust-toolchain pinned by SHA; resolves to 1.97.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build (debug)
        run: cargo build --all
      - name: Test
        run: cargo test --all

  minio-conformance:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/ready"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # dtolnay/rust-toolchain pinned; resolves to 1.97.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Create bucket
        run: |
          url=https://dl.min.io/client/mc/release/linux-amd64
          curl -fsSL "$url/mc" -o /tmp/mc
          sum=01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
          echo "$sum  /tmp/mc" | sha256sum --check --strict
          chmod +x /tmp/mc
          /tmp/mc alias set ci http://localhost:9000 minioadmin minioadmin
          /tmp/mc mb --ignore-existing ci/stowq-conformance
      - name: Conformance suite
        env:
          STOWQ_CONFORMANCE_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        run: >
          cargo test -p stowq-store-s3 --features conformance --
          --nocapture

  tla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download tla2tools
        run: |
          url=https://github.com/tlaplus/tlaplus/releases/download/v1.7.4
          curl -fsSL "$url/tla2tools.jar" -o /tmp/tla2tools.jar
          sum=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          echo "$sum  /tmp/tla2tools.jar" |
            sha256sum --check --strict
      - name: Check claims model
        run: >
          java -cp /tmp/tla2tools.jar tlc2.TLC
          model/claims/StowQClaims.tla
      - name: Check terminal model
        run: >
          java -cp /tmp/tla2tools.jar tlc2.TLC
          model/terminal/StowQTerminal.tla
